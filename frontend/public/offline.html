<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#284b63" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sin conexión · Osmi</title>
    <style>
      :root { color-scheme: light dark; --fg: #1d2731; --muted: #5b6874; --bg: #ffffff; --primary: #284b63; }
      @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --muted: #9aa7b2; --bg: #11181f; --primary: #7fa7c6; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); text-align: center; }
      main { max-width: 26rem; }
      img { width: 56px; height: 56px; }
      h1 { margin: 16px 0 8px; font-size: 1.375rem; }
      p { margin: 0 0 8px; color: var(--muted); line-height: 1.5; }
      a { display: inline-block; margin-top: 16px; padding: 10px 20px; border-radius: 8px; color: #fff; background: #284b63;
        text-decoration: none; font-weight: 600; }
      a.alt { color: var(--primary); background: transparent; border: 1px solid currentColor; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>No hay internet en este momento. Revisa la red e intenta de nuevo; lo que ya guardaste está a salvo.</p>
      <p lang="en">You're offline. Check the connection and try again.</p>
      <a href="/">Reintentar</a>
      <p><a class="alt" href="/pos-offline">Vender sin conexión</a></p>
    </main>
  </body>
</html>
